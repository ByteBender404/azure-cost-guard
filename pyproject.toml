[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-cost-guard"
version = "0.1.0"
description = "CLI tool for detecting billing anomalies in Azure cost data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "azure-identity>=1.15.0",
    "azure-mgmt-costmanagement>=4.0.0",
    "pandas>=2.0.0",
    "statsmodels>=0.14.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
    "pydantic>=2.4.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
azure-cost-guard = "azure_cost_guard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
